name: Deploy Viaticum

on:
  push:
    branches: [main, claude/trip-planning-app-kPSQ4]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check secret
        run: |
          if [ -n "$KEY" ]; then echo "✅ Chave presente (${#KEY} caracteres)"; else echo "❌ Chave vazia"; fi
        env:
          KEY: ${{ secrets.TRIPS_VIATICUM }}

      - run: npm run build
        env:
          VITE_BASE_PATH: /Trips/
          VITE_ANTHROPIC_KEY: ${{ secrets.TRIPS_VIATICUM || secrets.ANTHROPIC_API_KEY }}

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
