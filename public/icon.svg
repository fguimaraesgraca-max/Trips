<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="256" y1="0" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Glassy shine overlay -->
  <rect width="512" height="512" rx="115" fill="url(#shine)"/>

  <!-- Depth circles for subtle texture -->
  <circle cx="400" cy="118" r="190" fill="white" fill-opacity="0.05"/>
  <circle cx="100" cy="420" r="140" fill="white" fill-opacity="0.04"/>

  <!--
    Location pin: circle center (256,205) radius 120, tip at (256,415)
    Upper semicircle via two 90° clockwise arcs; tapering sides via cubic beziers
  -->
  <path d="M 256 85
           A 120 120 0 0 1 376 205
           C 376 272 314 342 256 415
           C 198 342 136 272 136 205
           A 120 120 0 0 1 256 85 Z"
        fill="white"/>

  <!-- Inner ring: same gradient punches a hole -->
  <circle cx="256" cy="205" r="52" fill="url(#bg)"/>

  <!-- Center dot -->
  <circle cx="256" cy="205" r="20" fill="white" fill-opacity="0.88"/>
</svg>
